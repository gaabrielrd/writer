name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela execuções antigas da mesma branch quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 é o piso declarado em engines/.nvmrc; 24 antecipa a próxima LTS.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências do backend
        run: npm ci --prefix functions

      - name: Validar
        run: npm run validate

      - name: Publicar relatório de cobertura
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      # Roda apenas no CI: uma falha aqui indica vulnerabilidade publicada,
      # não um erro de código. Manter fora do `validate` evita travar o
      # trabalho local por indisponibilidade do registry.
      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Auditar dependências do backend
        run: npm audit --prefix functions --audit-level=high

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar no navegador
        run: npm run test:e2e

      - name: Testar prévia visual com dados fictícios
        if: ${{ !cancelled() }}
        run: npx playwright test -c playwright.visual.config.ts

      - name: Publicar prévia visual para revisão
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-visual-preview
          path: |
            visual-playwright-report/
            visual-test-results/
            e2e/__screenshots__/linux/styleguide.png
          retention-days: 7
          if-no-files-found: warn

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
