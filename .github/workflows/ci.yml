name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela execuções antigas da mesma branch quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 é o piso declarado em engines/.nvmrc; 24 antecipa a próxima LTS.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências do backend
        run: npm ci --prefix functions

      - name: Validar
        run: npm run validate

      - name: Publicar relatório de cobertura
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          overwrite: true
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      # Roda apenas no CI: uma falha aqui indica vulnerabilidade publicada,
      # não um erro de código. Manter fora do `validate` evita travar o
      # trabalho local por indisponibilidade do registry.
      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Auditar dependências do backend
        run: npm audit --prefix functions --audit-level=high

  browser:
    name: Navegador de produção (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar no navegador
        run: npm run test:e2e

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          overwrite: true
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: Visual (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # A suíte completa inclui a seleção parcial nos seis projetos;
      # o sharding distribui os casos sem repetir nem filtrar cenários.
      - name: Testar prévia visual com dados fictícios
        run: npx playwright test -c playwright.visual.config.ts --shard=${{ matrix.shard }}/6

      - name: Identificar resultados do shard
        if: always()
        run: |
          if [ -f visual-test-results/results.json ]; then
            mv visual-test-results/results.json visual-test-results/results-${{ matrix.shard }}.json
          fi

      - name: Publicar relatório para consolidação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-visual-blob-${{ matrix.shard }}
          overwrite: true
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Publicar capturas e traces do shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-visual-results-${{ matrix.shard }}
          overwrite: true
          path: visual-test-results/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    # Conserva o nome do check requerido e só aprova com todos os jobs verdes.
    name: E2E (Chromium)
    needs: [browser, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar ferramenta de relatórios
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci

      - name: Baixar relatórios dos shards
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: writer-visual-blob-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Baixar capturas e traces
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: writer-visual-results-*
          path: visual-test-results/
          merge-multiple: true

      - name: Consolidar relatório visual
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: visual-playwright-report
        run: npx playwright merge-reports --reporter=html all-blob-reports

      - name: Publicar prévia visual para revisão
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-visual-preview
          overwrite: true
          path: |
            visual-playwright-report/
            visual-test-results/
            e2e/__screenshots__/linux/styleguide.png
          retention-days: 7
          if-no-files-found: warn

      - name: Exigir todos os testes aprovados
        if: always()
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: >-
          node -e "process.exit(process.env.BROWSER_RESULT === 'success' && process.env.VISUAL_RESULT === 'success' ? 0 : 1)"
